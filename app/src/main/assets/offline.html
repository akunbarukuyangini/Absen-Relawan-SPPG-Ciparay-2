<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidak ada koneksi</title>
<style>
  :root { --brand:#1B7F4F; --text:#1a1a1a; --muted:#6b6b6b; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --text:#f2f2f2; --muted:#a8a8a8; --bg:#121212; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Roboto","Helvetica Neue",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px; text-align:center;
  }
  .icon { width:72px; height:72px; margin:0 auto 20px; border-radius:50%;
    background:var(--brand); display:flex; align-items:center; justify-content:center; }
  .icon svg { width:36px; height:36px; fill:#fff; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 24px; }
  button {
    background:var(--brand); color:#fff; border:0; border-radius:10px;
    padding:14px 28px; font-size:16px; font-weight:600; width:100%; max-width:280px;
  }
  button:active { opacity:.8; }
</style>
</head>
<body>
  <div>
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 18a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM2 8.5l2 2a11.3 11.3 0 0116 0l2-2a14.1 14.1 0 00-20 0zm4 4l2 2a5.6 5.6 0 018 0l2-2a8.5 8.5 0 00-12 0z"/></svg>
    </div>
    <h1>Tidak ada koneksi internet</h1>
    <p>Aplikasi Absen Relawan membutuhkan koneksi internet.<br>Periksa data seluler atau WiFi Anda, lalu coba lagi.</p>
    <button onclick="if (window.AndroidBridge) AndroidBridge.retry(); else location.reload();">Coba lagi</button>
  </div>
</body>
</html>
